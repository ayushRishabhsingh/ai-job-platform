# Render Blueprint — provisions the API (always-on web service) and a
# managed Postgres database in one go.
#
# Usage: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and creates everything below automatically.
#
# Note: the Streamlit UI is deliberately not included here. The API alone
# serves the web app at "/" (see GETTING_STARTED.md), so one service is
# enough for "always on". Add a second `web` service using Dockerfile.ui
# later if you also want the separate Streamlit pages.

databases:
  - name: ai-job-platform-db
    plan: free
    databaseName: jobsdb
    user: jobsdb

services:
  - type: web
    name: ai-job-platform-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-job-platform-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DEFAULT_MATCH_STRATEGY
        value: overlap
    dockerCommand: sh -c "python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
